# Shared Caddy edge. Stateless: one machine in each of iad and sjc.
# After the first deploy, add the sjc machine:
#   fly machine clone <iad-machine-id> --region sjc -a websages-edge
app = "websages-edge"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    timeout = "2s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
